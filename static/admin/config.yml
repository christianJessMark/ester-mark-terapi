backend:
  name: github
  repo: christianJessMark/ester-mark-terapi
  branch: main

media_folder: static/uploads
public_folder: /uploads

collections:
  - name: "forside"
    label: "Forside"
    files:
      - name: "forside"
        label: "Forsideindhold"
        file: "content/_index.md"
        fields:
          # FORSIDE
          - { label: "Forside: Lille tekst over overskrift", name: "hero_label", widget: "string" }
          - { label: "Forside: Overskrift", name: "hero_heading", widget: "string" }
          - { label: "Forside: Indledende sætning", name: "hero_lead", widget: "string" }
          - { label: "Forside: Tekst", name: "hero_sub", widget: "text" }
          - { label: "Forside: Foto", name: "hero_photo", widget: "image" }
          - { label: "Forside: Knap (primær)", name: "hero_btn_primary", widget: "string" }
          - { label: "Forside: Knap (sekundær)", name: "hero_btn_ghost", widget: "string" }

          # INDIVIDUEL TERAPI
          - { label: "Individuel terapi: Overskrift (lille)", name: "terapi_label", widget: "string" }
          - { label: "Individuel terapi: Underoverskrift", name: "terapi_heading", widget: "string" }
          - { label: "Individuel terapi: Indledning", name: "terapi_intro", widget: "markdown" }
          - { label: "Individuel terapi: Liste-titel", name: "terapi_temaer_titel", widget: "string", hint: "Vises efterfulgt af kolon, fx: Måske genkender du, at du" }
          - label: "Individuel terapi: Liste"
            name: "terapi_temaer"
            widget: "list"
            field: { label: "Punkt", name: "punkt", widget: "string" }
          - { label: "Individuel terapi: Afslutning på listen", name: "terapi_outro", widget: "markdown" }
          - label: "Individuel terapi: Afsnit"
            name: "terapi_blokke"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Underoverskrift", name: "titel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "markdown" }

          # PARTERAPI
          - { label: "Parterapi: Overskrift (lille)", name: "parterapi_label", widget: "string" }
          - { label: "Parterapi: Underoverskrift", name: "parterapi_heading", widget: "string" }
          - { label: "Parterapi: Indledning", name: "parterapi_intro", widget: "markdown" }
          - { label: "Parterapi: Liste-titel", name: "parterapi_temaer_titel", widget: "string", hint: "Vises efterfulgt af kolon, fx: Parterapi kan være relevant, hvis I" }
          - label: "Parterapi: Liste"
            name: "parterapi_temaer"
            widget: "list"
            field: { label: "Punkt", name: "punkt", widget: "string" }
          - { label: "Parterapi: Afslutning på listen", name: "parterapi_outro", widget: "markdown" }
          - label: "Parterapi: Afsnit"
            name: "parterapi_blokke"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Underoverskrift", name: "titel", widget: "string" }
              - { label: "Tekst", name: "tekst", widget: "markdown" }

          # OM MIG
          - { label: "Om mig: Overskrift (lille)", name: "om_label", widget: "string" }
          - { label: "Om mig: Underoverskrift", name: "om_heading", widget: "string" }
          - { label: "Om mig: Tekst", name: "om_tekst", widget: "markdown" }
          - { label: "Om mig: Mærkat", name: "om_badge", widget: "string" }
          - { label: "Om mig: Foto", name: "om_photo", widget: "image" }
          - { label: "Uddannelse: Overskrift", name: "udd_heading", widget: "string" }
          - { label: "Uddannelse: Tekst", name: "udd_tekst", widget: "markdown" }
          - { label: "Min tilgang: Overskrift", name: "tilgang_heading", widget: "string" }
          - { label: "Min tilgang: Tekst", name: "tilgang_tekst", widget: "markdown" }
          - { label: "Klientcitat: Overskrift", name: "klient_heading", widget: "string" }
          - { label: "Klientcitat: Citat", name: "klient_citat", widget: "text", hint: "Skriv uden anførselstegn; de tilføjes automatisk" }
          - { label: "Klientcitat: Navn", name: "klient_navn", widget: "string" }

          # PRISER
          - { label: "Priser: Overskrift", name: "priser_heading", widget: "string" }
          - { label: "Priser: Tekst", name: "priser_intro", widget: "text" }
          - { label: "Individuel terapi: Navn", name: "pris_individuel_navn", widget: "string" }
          - { label: "Individuel terapi: Pris", name: "pris_individuel_beloeb", widget: "string" }
          - { label: "Individuel terapi: Varighed", name: "pris_individuel_varighed", widget: "string" }
          - { label: "Parterapi: Navn", name: "pris_par_navn", widget: "string" }
          - { label: "Parterapi: Tekst", name: "pris_par_intro", widget: "text" }
          - label: "Parterapi: Priser"
            name: "pris_par_linjer"
            widget: "list"
            summary: "{{fields.navn}}"
            fields:
              - { label: "Navn", name: "navn", widget: "string" }
              - { label: "Varighed", name: "varighed", widget: "string" }
              - { label: "Pris", name: "beloeb", widget: "string" }

          # ONLINETERAPI
          - { label: "Onlineterapi: Overskrift", name: "online_heading", widget: "string" }
          - { label: "Onlineterapi: Tekst", name: "online_tekst", widget: "markdown" }

          # FAQ
          - { label: "FAQ: Overskrift", name: "faq_heading", widget: "string" }
          - label: "FAQ: Grupper"
            name: "faq_grupper"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Gruppens titel", name: "titel", widget: "string" }
              - label: "Spørgsmål"
                name: "sporgsmaal"
                widget: "list"
                summary: "{{fields.q}}"
                fields:
                  - { label: "Spørgsmål", name: "q", widget: "string" }
                  - { label: "Svar", name: "a", widget: "text" }

          # BETALING OG AFBUD
          - { label: "Betaling og afbud: Overskrift", name: "betaling_heading", widget: "string" }
          - { label: "Betaling", name: "betaling_tekst", widget: "text" }
          - { label: "Afbud", name: "afbud_tekst", widget: "text" }

          # KONTAKT
          - { label: "Kontakt: Overskrift", name: "kontakt_heading", widget: "string" }
          - { label: "Kontakt: Tekst", name: "kontakt_tekst", widget: "markdown" }
          - { label: "Kontakt: Telefon", name: "kontakt_telefon", widget: "string" }
          - { label: "Kontakt: Samtaler-titel", name: "kontakt_samtaler_titel", widget: "string" }
          - { label: "Kontakt: Samtaler", name: "kontakt_samtaler", widget: "markdown" }
